<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EXACT V26">
  <!-- Charcoal rounded tile — even coords so the mark stays sharp at 16px -->
  <rect width="32" height="32" rx="6" fill="#0b0c0b"/>
  <!-- Sage pitch -->
  <rect x="6" y="8" width="20" height="16" rx="1.5" fill="#6b9a7a"/>
  <!-- Center circle -->
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="#eceae4" stroke-width="2"/>
  <!-- Tiny cream ball (center spot) -->
  <circle cx="16" cy="16" r="2" fill="#eceae4"/>
</svg>
